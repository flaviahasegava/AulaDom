<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="src/css/estilo.css">
    <title>Aula Dom</title>
</head>

<body>

    <header>
        <!-- id para o javascript e class para o css / casos complexos -->
        <h1 id="titulo">Título</h1>
    </header>

    <main>
        <section>
            <p>
                <!-- label (rótulo) / for (nome do rótulo) -->
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <!-- JavaScript -> onclick (evento) / método mudar() -->
                <button type="submit" onclick="mudar()">Mudar</button>
            </p>
        </section>

        <hr>

        <section>
            <h2>Classificação Time</h2>
            <p>Primeiro Colocado: <span class="time"></span></p>
            <p>Segundo Colocado: <span class="time"></span></p>
            <p>Terceiro Colocado: <span class="time"></span></p>

            <p>
                <label for="novo">Novo Classificado:</label>
                <input type="text" id="novo" name="novo">
            </p>

            <p>
                <label for="posicao">Posição</label>
                <input type="number" min="1" max="3" id="posicao" name="posicao">
            </p>

            <button type="submit" onclick="inserir()">Adicionar time</button>
        </section>

        <hr>

        <section>
            <h2>Criando uma Imagem</h2>
            <button type="submit" id="btnImagem">Gerar Imagem</button>

            <div id="containerImagem"></div>
        </section>
    </main>

    <!-- JS EXTERNO -->
    <script src="./src/js/script.js"></script>
</body>

</html>
